[project]
name = "gitnuke"
version = "0.1.0"
description = "Local web interface to review and delete personal GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.1",
    "loguru>=0.7.3",
]

[project.scripts]
gitnuke = "gitnuke:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
